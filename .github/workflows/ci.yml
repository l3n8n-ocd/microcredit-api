name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build · Fold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Chromium and Roboto (the font Android phones render)
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-roboto
      - name: "Above-the-fold + 5-route responsiveness (Playwright at 375px and 1280px)"
        run: npm run test:e2e
